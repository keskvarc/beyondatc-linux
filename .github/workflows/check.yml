name: Build and tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  connector:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: cachix/install-nix-action@d9186cbdca7adedf113a159fa91f725a27866771 # v31
      - run: nix flake check --print-build-logs
